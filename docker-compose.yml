services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=easygift
    ports:
      - 5433:5432
  backend:
    build: ./backend
    ports:
      - 4001:4000
    volumes:
      - ./backend/src:/app/src
      - ./backend/src/db.ts:/app/src/db.ts
    env_file:
      - ./global.env
      - ./backend/.env
      # - ./secret.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=easygift
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://backend:4001/graphql?query=%7B__typename%7D -H 'Apollo-Require-Preflight: true' || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - 3001:3000
    volumes:
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/src:/app/src
    env_file:
      - ./frontend/.env
      - ./global.env
